name: Build JohalPlay IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA (macOS runner)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project (any .zip in the repo)
        run: |
          ZIPFILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIPFILE" ]; then
            echo ">> Unzipping $ZIPFILE ..."
            unzip -oq "$ZIPFILE"
            if [ -d johalplay ]; then
              shopt -s dotglob
              mv johalplay/* .
              rmdir johalplay
            fi
          fi
          test -f JohalPlay.xcodeproj/project.pbxproj || (echo "ERROR: JohalPlay.xcodeproj not found at repo root" && exit 1)
          echo ">> Project files ready"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive for iOS device (unsigned)
        run: |
          xcodebuild \
            -project JohalPlay.xcodeproj \
            -scheme JohalPlay \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/JohalPlay.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package IPA
        run: |
          APP_DIR="build/JohalPlay.xcarchive/Products/Applications"
          mkdir -p build/Payload
          mv "$APP_DIR/JohalPlay.app" build/Payload/
          ( cd build && zip -qry JohalPlay.ipa Payload )
          ls -lh build/JohalPlay.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JohalPlay-unsigned.ipa
          path: build/JohalPlay.ipa
          if-no-files-found: error
